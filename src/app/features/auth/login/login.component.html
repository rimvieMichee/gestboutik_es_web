<div class="login-page">
  <div class="login-panel">
    <img class="brand-mark" src="selio-mark-light.svg" alt="SELIO" />
    <h1>SELIO</h1>
    <p class="tagline">Plateforme de gestion de boutiques</p>
  </div>

  <div class="login-form-side">
    <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
      <h2>Connexion</h2>
      <p class="subtitle">Accédez à votre espace d'administration</p>

      <div class="form-field">
        <label for="username">Nom d'utilisateur</label>
        <input id="username" type="text" formControlName="username" autocomplete="username" />
      </div>

      <div class="form-field">
        <label for="password">Mot de passe</label>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            [attr.aria-pressed]="showPassword()"
          >
            <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
          </button>
        </div>
      </div>

      @if (errorMessage()) {
        <p class="error-text">{{ errorMessage() }}</p>
      }

      <button class="btn" type="submit" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>
  </div>
</div>
