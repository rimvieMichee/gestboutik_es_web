<h1>{{ isEdit() ? 'Modifier le produit' : 'Nouveau produit' }}</h1>

<form class="card" style="max-width: 480px" [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-field">
    <label for="nom">Nom *</label>
    <input id="nom" type="text" formControlName="nom" />
  </div>

  <div class="form-field">
    <label for="prixVente">Prix de vente (FCFA) *</label>
    <input id="prixVente" type="number" step="0.01" formControlName="prixVente" />
  </div>

  @if (!isEdit()) {
    <div class="form-field">
      <label for="quantiteDisponible">Stock *</label>
      <input id="quantiteDisponible" type="number" formControlName="quantiteDisponible" />
    </div>
  }

  <div class="form-field">
    <label for="seuilAlerte">Seuil d'alerte</label>
    <input id="seuilAlerte" type="number" formControlName="seuilAlerte" />
  </div>

  @if (errorMessage()) {
    <p class="error-text">{{ errorMessage() }}</p>
  }

  <div class="toolbar">
    <button class="btn" type="submit" [disabled]="form.invalid || loading()">
      {{ loading() ? 'Enregistrement...' : 'Enregistrer' }}
    </button>
    <a class="btn btn-secondary" routerLink="/products">Annuler</a>
  </div>
</form>
