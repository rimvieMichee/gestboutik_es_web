<h1>Ventes</h1>

<div class="toolbar">
  <input type="date" [ngModel]="dateFrom()" (ngModelChange)="dateFrom.set($event); onFilterChange()" />
  <input type="date" [ngModel]="dateTo()" (ngModelChange)="dateTo.set($event); onFilterChange()" />
</div>

<div class="card">
  <table class="data-table">
    <thead>
      <tr>
        <th>N° vente</th>
        <th>Employé</th>
        <th>Date</th>
        <th>Total</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (sale of sales(); track sale.id) {
        <tr>
          <td>{{ sale.numeroVente }}</td>
          <td>{{ sale.user | fullName }}</td>
          <td>{{ sale.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
          <td>{{ sale.montantTotal }} FCFA</td>
          <td>
            <a class="btn btn-secondary btn-sm" [routerLink]="['/sales', sale.id]">Détail</a>
          </td>
        </tr>
      }
      @if (!sales().length) {
        <tr><td colspan="5" class="empty-state">Aucune vente.</td></tr>
      }
    </tbody>
  </table>
  <app-pagination [meta]="meta()" (pageChange)="onPageChange($event)" />
</div>
