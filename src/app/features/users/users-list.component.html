<div class="page-header">
  <h1>Employés</h1>
  <a class="btn" routerLink="/users/new">+ Nouvel employé</a>
</div>

<div class="toolbar">
  <input
    type="text"
    placeholder="Rechercher par nom ou identifiant..."
    [ngModel]="search()"
    (ngModelChange)="search.set($event)"
    (keyup.enter)="onSearch()"
  />
  <button class="btn btn-secondary btn-sm" (click)="onSearch()">Rechercher</button>
</div>

<div class="card">
  <table class="data-table">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Identifiant</th>
        <th>Statut</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td>{{ user.prenom }} {{ user.nom }}</td>
          <td>{{ user.username }}</td>
          <td>
            <span class="badge" [class.badge-success]="user.statut === 'ACTIVE'" [class.badge-danger]="user.statut === 'INACTIVE'">
              {{ user.statut === 'ACTIVE' ? 'Actif' : 'Inactif' }}
            </span>
          </td>
          <td class="actions-cell">
            <a class="btn btn-secondary btn-sm" [routerLink]="['/users', user.id, 'edit']">Modifier</a>
            <button class="btn btn-secondary btn-sm" (click)="resetPassword(user)">Mdp</button>
            <button class="btn btn-sm" [class.btn-danger]="user.statut === 'ACTIVE'" (click)="toggleStatus(user)">
              {{ user.statut === 'ACTIVE' ? 'Désactiver' : 'Activer' }}
            </button>
          </td>
        </tr>
      }
      @if (!users().length) {
        <tr><td colspan="4" class="empty-state">Aucun employé.</td></tr>
      }
    </tbody>
  </table>
  <app-pagination [meta]="meta()" (pageChange)="onPageChange($event)" />
</div>
